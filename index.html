<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthDesk - School Clinic</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2e8b57">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HealthDesk">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <div class="header-logo">
            <img src="icon-192.png" alt="HealthDesk Logo">
        </div>

        <div class="header-title">
            <h1>HEALTHDESK</h1>
            <p>School Clinic</p>
        </div>

        <button
            type="button"
            id="installBtn"
            class="install-btn">
            📱 Download App
        </button>

    </header>


    <!-- MAIN -->
    <main class="auth-container">


        <!-- ========================= -->
        <!-- SIGN IN -->
        <!-- ========================= -->

        <section id="loginSection" class="auth-card">

            <h2>Welcome Back!</h2>

            <p class="auth-subtitle">
                Sign in to your HealthDesk account
            </p>


            <!-- LOGIN FORM -->
            <form
                id="loginForm"
                action="login.php"
                method="POST">


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        placeholder="Enter your username"
                        required>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- LOGIN MESSAGE -->
                <p
                    id="loginMessage"
                    class="form-message">
                </p>


                <!-- SIGN IN BUTTON -->
                <button
                    type="submit"
                    class="auth-btn">
                    Sign In
                </button>

            </form>


            <!-- GO TO SIGN UP -->
            <p class="switch-text">

                Don't have an account?

                <button
                    type="button"
                    id="showSignup"
                    class="link-btn">
                    Create an account
                </button>

            </p>

        </section>



        <!-- ========================= -->
        <!-- SIGN UP -->
        <!-- ========================= -->

        <section
            id="signupSection"
            class="auth-card hidden">

            <h2>Create Account</h2>

            <p class="auth-subtitle">
                Register your HealthDesk account
            </p>


            <!-- SIGNUP FORM -->
            <form
                id="signupForm"
                action="signup.php"
                method="POST">


                <!-- FIRST NAME -->
                <div class="form-group">

                    <label for="signupFirstName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="signupFirstName"
                        name="first_name"
                        placeholder="Enter your first name"
                        required>

                </div>


                <!-- LAST NAME -->
                <div class="form-group">

                    <label for="signupLastName">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="signupLastName"
                        name="last_name"
                        placeholder="Enter your last name"
                        required>

                </div>


                <!-- STUDENT ID -->
                <div class="form-group">

                    <label for="signupStudentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="signupStudentId"
                        name="student_id"
                        placeholder="Enter your student ID"
                        required>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="signupUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signupUsername"
                        name="username"
                        placeholder="Create a username"
                        required>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                </div>


                <!-- SIGNUP MESSAGE -->
                <p
                    id="signupMessage"
                    class="form-message">
                </p>


                <!-- CREATE ACCOUNT BUTTON -->
                <button
                    type="submit"
                    class="auth-btn">
                    Create Account
                </button>

            </form>


            <!-- GO TO SIGN IN -->
            <p class="switch-text">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                    class="link-btn">
                    Sign In
                </button>

            </p>

        </section>

    </main>



    <!-- DOWNLOAD OVERLAY -->
    <div
        id="downloadOverlay"
        class="download-overlay hidden">

        <div class="download-box">

            <h3>Preparing HealthDesk...</h3>

            <p id="downloadMessage">
                Preparing the app for installation...
            </p>

            <div class="download-progress">

                <div
                    id="downloadProgressBar"
                    class="download-progress-bar">
                </div>

            </div>

            <p id="downloadCountdown">
                5
            </p>

        </div>

    </div>



    <!-- JAVASCRIPT -->
    <script src="script.js"></script>


    <!-- SERVICE WORKER -->
    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker
                    .register("service-worker.js")
                    .catch(function (error) {

                        console.log(
                            "Service Worker registration failed:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

</html>
